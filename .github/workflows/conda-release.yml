name: Conda Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v, e.g. 0.1.8)'
        required: true
        default: '0.1.8'

jobs:
  conda-build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          auto-update-conda: true
          python-version: '3.12'

      - name: Install build tools
        shell: bash -l {0}
        run: conda install -y -n base -c conda-forge conda-build anaconda-client

      - name: Extract version and compute sha256
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          TARBALL_URL="https://github.com/TobyBaril/EarlGreyParTEA/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "${TARBALL_URL}" | sha256sum | awk '{print $1}')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA256=${SHA256}"   >> "$GITHUB_ENV"

      - name: Update conda/meta.yaml (version, sha256, build number)
        run: |
          CURRENT_VERSION=$(grep '{% set version' conda/meta.yaml | sed 's/.*"\(.*\)".*/\1/')
          CURRENT_BUILD=$(grep '  number:' conda/meta.yaml | awk '{print $2}')

          if [ "${VERSION}" = "${CURRENT_VERSION}" ]; then
            NEW_BUILD=$((CURRENT_BUILD + 1))
            echo "Version unchanged (${VERSION}); incrementing build number: ${CURRENT_BUILD} -> ${NEW_BUILD}"
          else
            NEW_BUILD=0
            echo "New version: ${CURRENT_VERSION} -> ${VERSION}; resetting build number to 0"
          fi

          sed -i "s|{% set version = \".*\" %}|{% set version = \"${VERSION}\" %}|" conda/meta.yaml
          sed -i "s|  sha256: .*|  sha256: ${SHA256}|"                             conda/meta.yaml
          sed -i "s|  number: [0-9]*|  number: ${NEW_BUILD}|"                      conda/meta.yaml

      - name: Lint the conda recipe
        shell: bash -l {0}
        run: conda build --check conda/

      - name: Commit and push updated conda/meta.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conda/meta.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update conda/meta.yaml for release v${VERSION} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda build conda/ -c conda-forge -c bioconda --no-anaconda-upload
          echo "PACKAGE_PATH=$(conda build conda/ --output)" >> "$GITHUB_ENV"

      - name: Upload to Anaconda
        shell: bash -l {0}
        run: |
          conda run -n base anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload \
            --user toby_baril_bio \
            --force \
            "${PACKAGE_PATH}"
